version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: bsc_sniper_mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=bsc_sniper
    command: mongod --bind_ip 0.0.0.0
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

volumes:
  mongodb_data: 